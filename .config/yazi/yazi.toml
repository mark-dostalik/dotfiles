[mgr]
show_hidden = true

[preview]
max_width = 2400
max_height = 3600

[plugin]
prepend_previewers = [
  { mime = "image/tiff", run = "magick" },

]
prepend_preloaders = [
  { mime = "image/tiff", run = "magick" },
]

[opener]
browser = [
  { run = 'open -a "Google Chrome" %s', orphan = true, desc = "Open in Browser" }
]
pdf = [
  { run = 'open -a "Preview" "$@"', orphan = true, desc = "Preview" }
]
text = [
  { run = '$EDITOR "$@"', block = true, desc = "$EDITOR" },
]
video = [
  { run = 'open -a "VLC" "$@"', orphan = true, desc = "VLC" }
]

[open]
rules = [
  # 1. Web files first (Highest Priority)
  { mime = "text/html", use = "browser" },
  { url = "*.html", use = "browser" },
  { url = "*.htm", use = "browser" },

  # 2. Specific file types
  { mime = "application/json", use = "text" },
  { mime = "application/pdf", use = "pdf" },
  
  # 3. Wildcard fallbacks (Lowest Priority)
  { mime = "text/*", use = "text" },
  { mime = "video/*", use = "video" },
]
